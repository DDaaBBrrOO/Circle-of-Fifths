name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Setup Java JDK
      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # 4. Android SDK is pre-installed on ubuntu-latest
      #    We just need to accept licenses and install required components
      - name: 🤖 Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          
          # Accept all licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Install required platform and build tools
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      # 5. Install npm dependencies
      - name: 📥 Install dependencies
        run: npm ci

      # 6. Build web application
      - name: 🏗️ Build web app
        run: npm run build

      # 7. Install Capacitor
      - name: 🔌 Install Capacitor
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap --version

      # 8. Add Android platform
      - name: 📱 Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add"
          fi

      # 9. Sync web assets to native project
      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      # 10. Make gradlew executable
      - name: 🔐 Make gradlew executable
        run: chmod +x android/gradlew

      # 11. Create local.properties for Android SDK path
      - name: 📝 Configure Android SDK path
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      # 12. Build APK
      - name: 🔨 Build APK
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      # 13. Find APK file
      - name: 🔍 Locate APK
        id: find_apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          else
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          fi
          
          if [ -z "$APK_PATH" ]; then
            echo "❌ APK file not found!"
            find android/app/build/outputs -name "*.apk" -type f 2>/dev/null || true
            exit 1
          fi
          
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "✅ APK found at: $APK_PATH"
          ls -lh "$APK_PATH"

      # 14. Upload APK as artifact
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: circle-of-fifths-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # 15. Create Release on tag push
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 16. Summary
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🎸 Circle of Fifths — APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Node.js** | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java** | ${{ env.JAVA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ steps.find_apk.outputs.apk_path }}" ]; then
            APK_SIZE=$(du -h "${{ steps.find_apk.outputs.apk_path }}" | cut -f1)
            echo "✅ **APK built successfully** — Size: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **APK build failed**" >> $GITHUB_STEP_SUMMARY
          fi
