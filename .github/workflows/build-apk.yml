name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type (debug/release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '34'
  ANDROID_BUILD_TOOLS: '34.0.0'

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 3. Setup Java JDK
      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      # 4. Setup Android SDK
      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-${{ env.ANDROID_API_LEVEL }}" \
                     "build-tools;${{ env.ANDROID_BUILD_TOOLS }}" \
                     "platform-tools"

      # 5. Install npm dependencies
      - name: 📥 Install dependencies
        run: npm ci

      # 6. Build web application
      - name: 🏗️ Build web app
        run: npm run build

      # 7. Install Capacitor (if not already in package.json)
      - name: 🔌 Install Capacitor
        run: |
          npm install --save @capacitor/core @capacitor/cli @capacitor/android
          npx cap --version

      # 8. Add Android platform (skip if already exists)
      - name: 📱 Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            echo "Android platform already exists, skipping add"
          fi

      # 9. Sync web assets to native project
      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      # 10. Make gradlew executable
      - name: 🔐 Make gradlew executable
        run: chmod +x android/gradlew

      # 11. Build APK
      - name: 🔨 Build APK
        run: |
          cd android
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      # 12. Find APK file
      - name: 🔍 Locate APK
        id: find_apk
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "release" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          else
            APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "APK found at: $APK_PATH"
          ls -lh "$APK_PATH"

      # 13. Upload APK as artifact
      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: circle-of-fifths-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error

      # 14. Create Release on tag push
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 15. Summary
      - name: 📊 Build Summary
        if: always()
        run: |
          echo "## 🎸 Circle of Fifths — APK Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Node.js** | ${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Java** | ${{ env.JAVA_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Android API** | ${{ env.ANDROID_API_LEVEL }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Type** | ${{ github.event.inputs.build_type || 'debug' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ steps.find_apk.outputs.apk_path }}" ]; then
            APK_SIZE=$(du -h "${{ steps.find_apk.outputs.apk_path }}" | cut -f1)
            echo "✅ **APK built successfully** — Size: $APK_SIZE" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **APK build failed**" >> $GITHUB_STEP_SUMMARY
          fi
