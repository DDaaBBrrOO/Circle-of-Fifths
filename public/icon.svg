<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#0f0f1e"/>
  
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#FFD700" stroke-width="4"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#FFD700" stroke-width="3"/>
  
  <!-- Radial lines dividing into 12 segments -->
  <g stroke="#FFD700" stroke-width="2" opacity="0.6">
    <line x1="256" y1="56" x2="256" y2="116"/>
    <line x1="356" y1="106" x2="326" y2="158"/>
    <line x1="426" y1="206" x2="376" y2="226"/>
    <line x1="426" y1="306" x2="376" y2="286"/>
    <line x1="356" y1="406" x2="326" y2="354"/>
    <line x1="256" y1="456" x2="256" y2="396"/>
    <line x1="156" y1="406" x2="186" y2="354"/>
    <line x1="86" y1="306" x2="136" y2="286"/>
    <line x1="86" y1="206" x2="136" y2="226"/>
    <line x1="156" y1="106" x2="186" y2="158"/>
  </g>
  
  <!-- Musical notes (simplified as dots) -->
  <g fill="#FFD700">
    <circle cx="256" cy="96" r="8"/>
    <circle cx="336" cy="136" r="8"/>
    <circle cx="396" cy="216" r="8"/>
    <circle cx="396" cy="296" r="8"/>
    <circle cx="336" cy="376" r="8"/>
    <circle cx="256" cy="416" r="8"/>
    <circle cx="176" cy="376" r="8"/>
    <circle cx="116" cy="296" r="8"/>
    <circle cx="116" cy="216" r="8"/>
    <circle cx="176" cy="136" r="8"/>
  </g>
  
  <!-- Center circle -->
  <circle cx="256" cy="256" r="60" fill="#1a1a2e" stroke="#FFD700" stroke-width="2"/>
  
  <!-- Center text -->
  <text x="256" y="246" text-anchor="middle" fill="#FFD700" font-size="32" font-weight="bold" font-family="Arial, sans-serif">♭</text>
  <text x="256" y="276" text-anchor="middle" fill="#FFD700" font-size="14" font-family="Arial, sans-serif">Circle</text>
</svg>
